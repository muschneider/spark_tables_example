[tasks.shell]
description = "Spark shell preloaded with conf/exploration.scala"
interactive = true
raw_args = true
dir = "{{ config_root }}"
run = """
exec $SPARK_HOME/bin/spark-shell \
  --driver-memory 6g \
  --conf spark.ui.enabled=false \
  --master "local[*]" \
  --conf spark.sql.requireAllClusterKeysForCoPartition=false \
  --conf spark.sql.warehouse.dir="$WAREHOUSE" \
  --conf spark.driver.extraJavaOptions="-Dderby.system.home=$WAREHOUSE" \
  -i conf/exploration.scala
"""


[tasks.join_example]
description = "Spark shell Join Example"
interactive = true
raw_args = true
dir = "{{ config_root }}"
run = """
spark-shell --master "local[*]" \
  --conf spark.sql.warehouse.dir=/tmp/warehouse \
  --conf spark.driver.extraJavaOptions=-Dderby.system.home=/tmp/warehouse \
  -i conf/join_example.scala
"""


[tasks.join_example_with_filter]
description = "Spark shell Join Example filtered by a documento list + dataRef"
interactive = true
raw_args = true
dir = "{{ config_root }}"
run = """
exec $SPARK_HOME/bin/spark-shell \
  --driver-memory 4g \
  --conf spark.ui.enabled=false \
  --master "local[*]" \
  --conf spark.sql.warehouse.dir="$WAREHOUSE" \
  --conf spark.driver.extraJavaOptions="-Dderby.system.home=$WAREHOUSE" \
  -i conf/join_example_with_filter.scala
"""


[tasks.shell_clear]
description = "Spark shell preloaded with conf/exploration.scala"
interactive = true
raw_args = true
dir = "{{ config_root }}"
run = """
exec $SPARK_HOME/bin/spark-shell \
  --driver-memory 6g \
