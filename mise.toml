  --conf spark.sql.warehouse.dir="$WAREHOUSE" \
  --conf spark.driver.extraJavaOptions="-Dderby.system.home=$WAREHOUSE"
"""


[tasks.clean]
description = "Drop build output and the local warehouse/metastore"
run = "mvn -B -q clean && rm -rf $WAREHOUSE"
